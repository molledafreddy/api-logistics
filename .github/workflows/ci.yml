name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run linter
        run: pnpm run lint:check

  test:
    name: 🧪 Unit & E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: logistics_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      CI: 'true'
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: logistics_test
      DB_SSL: false
      DB_LOGGING: false
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      JWT_ACCESS_SECRET: test-access-secret-key-for-ci
      JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
      SUPABASE_JWT_SECRET: test-supabase-secret-key-for-ci
      SUPABASE_URL: https://test-project.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-ci

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Run database migrations
        run: pnpm run migration:run

      - name: 🧪 Run unit tests with coverage
        run: pnpm test --coverage --passWithNoTests
        continue-on-error: false

      - name: 🚀 Run E2E tests with coverage
        run: pnpm run test:e2e --coverage --passWithNoTests
        continue-on-error: false

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 30

  build:
    name: 🏗️ Build TypeScript
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build project
        run: pnpm run build

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: docker build -t api-logistics:${{ github.sha }} -t api-logistics:latest .

      - name: 📝 Docker image info
        run: |
          echo "✅ Docker image built successfully"
          echo "Image: api-logistics:${{ github.sha }}"
          echo "Tag: api-logistics:latest"
          docker images | grep api-logistics

  notify:
    name: 📢 Notify Status
    runs-on: ubuntu-latest
    needs: [lint, test, build, docker]
    if: always()
    
    steps:
      - name: 📊 Summary
        run: |
          echo "═══════════════════════════════════════════"
          echo "✅ CI/CD Pipeline Complete"
          echo "═══════════════════════════════════════════"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Status: ${{ job.status }}"
          echo "═══════════════════════════════════════════"

      - name: ❌ Fail if any job failed
        if: |
          needs.lint.result == 'failure' ||
          needs.test.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1
