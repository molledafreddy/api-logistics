# docker-compose.yml — API Logistics (desarrollo local)
version: '3.8'

services:
  # ─── PostgreSQL + PostGIS ────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: logistics-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: logistics_dev
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logistics']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: logistics-redis
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3 local) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: logistics-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── MinIO Bootstrap (crear buckets) ─────
  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/logistics-avatars --ignore-existing;
      mc mb local/logistics-documents --ignore-existing;
      mc mb local/logistics-receipts --ignore-existing;
      mc mb local/logistics-chat --ignore-existing;
      mc mb local/logistics-exports --ignore-existing;
      echo 'Buckets created successfully';
      "

  # ─── MailHog (email sandbox) ─────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: logistics-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025']
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Redis Commander (admin UI) ──────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: logistics-redis-ui
    ports:
      - '8081:8081'
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data:
